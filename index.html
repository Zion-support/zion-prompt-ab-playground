<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Prompt A/B Playground</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:760px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}textarea{width:100%;padding:.5rem}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px;margin-top:.5rem}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>🆚 Prompt A/B Playground</h1><p>Compare two prompt variants.</p><h3>Variant A</h3><textarea id="a" rows="3" placeholder="Prompt A..."></textarea><h3>Variant B</h3><textarea id="b" rows="3" placeholder="Prompt B..."></textarea><br><button onclick="go()">Compare</button><div id="out"></div><script>function score(p){let s=40;if(/you are|act as/i.test(p))s+=15;if(/format|json|table|list/i.test(p))s+=15;if(/example/i.test(p))s+=15;if(p.split(/\s+/).length>15)s+=15;return s}function go(){const a=document.getElementById('a').value,b=document.getElementById('b').value;const sa=score(a),sb=score(b);document.getElementById('out').textContent=`A: ${sa}/100 (${a.split(/\s+/).length} words)\nB: ${sb}/100 (${b.split(/\s+/).length} words)\nWinner: ${sa>sb?'A 🏆':sb>sa?'B 🏆':'Tie'}\n\nSystematic A/B evals on real datasets: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/zion-prompt-ab-playground">GitHub</a> · <a href="https://ziontechgroup.com/ai-prompt-engineer/">Prompt Engineer</a></p></body></html>
